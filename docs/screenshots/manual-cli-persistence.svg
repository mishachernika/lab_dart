<svg xmlns="http://www.w3.org/2000/svg" width="894" height="494" viewBox="0 0 894 494">
  <rect width="100%" height="100%" rx="13" fill="#0b1020"/>
  <path d="M13 0h868a13 13 0 0 1 13 13v39H0V13A13 13 0 0 1 13 0Z" fill="#20283a"/>
  <circle cx="20" cy="26" r="6" fill="#ff625a"/>
  <circle cx="42" cy="26" r="6" fill="#ffc04d"/>
  <circle cx="64" cy="26" r="6" fill="#36c979"/>
  <text x="88" y="31" class="title">Ручний прогін · збереження між запусками</text>
  <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="14" fill="#e2e8f0">
  <text x="26" y="76" class="line">ПЕРЕВІРКА ЗБЕРЕЖЕННЯ МІЖ ЗАПУСКАМИ</text>
  <text x="26" y="98" class="line"></text>
  <text x="26" y="120" class="line">[Запуск 1]</text>
  <text x="26" y="142" class="line">Додано Testmon вручну та завантажено Bulbasaur із PokéAPI.</text>
  <text x="26" y="164" class="line">Testmon (ID 999) видалено з колекції.</text>
  <text x="26" y="186" class="line">Перед завершенням у data.json залишилися Pikachu та Bulbasaur; є тренер Ash.</text>
  <text x="26" y="208" class="line"></text>
  <text x="26" y="230" class="line">[Запуск 2]</text>
  <text x="26" y="252" class="line">Дані зчитано з data.json: покемонів — 2, тренерів — 1.</text>
  <text x="26" y="274" class="line">  #25 pikachu [electric] зріст: 4, вага: 60, досвід: 112</text>
  <text x="26" y="296" class="line">  #1 bulbasaur [grass] зріст: 7, вага: 69, досвід: 64</text>
  <text x="26" y="318" class="line">Покемона з ID 1 видалено.</text>
  <text x="26" y="340" class="line">У тренера Ash: покемонів — 0.</text>
  <text x="26" y="362" class="line"></text>
  <text x="26" y="384" class="line">[Запуск 3]</text>
  <text x="26" y="406" class="line">Дані зчитано з data.json: покемонів — 1, тренерів — 1.</text>
  <text x="26" y="428" class="line">  #25 pikachu [electric] зріст: 4, вага: 60, досвід: 112</text>
  <text x="26" y="450" class="line"></text>
  <text x="26" y="472" class="line">Висновок: додавання та видалення зберігаються, файл успішно відновлюється після повторного запуску.</text>
  </g>
  <style>.title {font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #cbd5e1;}</style>
</svg>
