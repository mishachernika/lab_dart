<svg xmlns="http://www.w3.org/2000/svg" width="840" height="934" viewBox="0 0 840 934">
  <rect width="100%" height="100%" rx="13" fill="#0b1020"/>
  <path d="M13 0h814a13 13 0 0 1 13 13v39H0V13A13 13 0 0 1 13 0Z" fill="#20283a"/>
  <circle cx="20" cy="26" r="6" fill="#ff625a"/>
  <circle cx="42" cy="26" r="6" fill="#ffc04d"/>
  <circle cx="64" cy="26" r="6" fill="#36c979"/>
  <text x="88" y="31" class="title">Ручний прогін · меню 1–8</text>
  <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="14" fill="#e2e8f0">
  <text x="26" y="76" class="line">КОНСОЛЬНЕ ТЕСТУВАННЯ МЕНЮ (ізольована копія проєкту)</text>
  <text x="26" y="98" class="line"></text>
  <text x="26" y="120" class="line">Початковий стан: у data.json — Pikachu, тренерів немає.</text>
  <text x="26" y="142" class="line"></text>
  <text x="26" y="164" class="line">[1] Перегляд списку</text>
  <text x="26" y="186" class="line">Усі покемони (1):</text>
  <text x="26" y="208" class="line">  #25 pikachu [electric] зріст: 4, вага: 60, досвід: 112</text>
  <text x="26" y="230" class="line"></text>
  <text x="26" y="252" class="line">[2] Додавання вручну</text>
  <text x="26" y="274" class="line">Додано: #999 testmon [other] зріст: 12, вага: 34, досвід: 56</text>
  <text x="26" y="296" class="line"></text>
  <text x="26" y="318" class="line">[3] Завантаження з PokéAPI</text>
  <text x="26" y="340" class="line">Отримано з API й додано: #1 bulbasaur [grass] зріст: 7, вага: 69, досвід: 64</text>
  <text x="26" y="362" class="line"></text>
  <text x="26" y="384" class="line">[5] Пошук за частиною імені «bulb»</text>
  <text x="26" y="406" class="line">Результати пошуку (1):</text>
  <text x="26" y="428" class="line">  #1 bulbasaur [grass] зріст: 7, вага: 69, досвід: 64</text>
  <text x="26" y="450" class="line"></text>
  <text x="26" y="472" class="line">[6] Фільтр за типом grass</text>
  <text x="26" y="494" class="line">Покемони типу grass (1):</text>
  <text x="26" y="516" class="line">  #1 bulbasaur [grass] зріст: 7, вага: 69, досвід: 64</text>
  <text x="26" y="538" class="line"></text>
  <text x="26" y="560" class="line">[7] Сортування за ID за зростанням</text>
  <text x="26" y="582" class="line">Сортування за id (3):</text>
  <text x="26" y="604" class="line">  #1 bulbasaur [grass] зріст: 7, вага: 69, досвід: 64</text>
  <text x="26" y="626" class="line">  #25 pikachu [electric] зріст: 4, вага: 60, досвід: 112</text>
  <text x="26" y="648" class="line">  #999 testmon [other] зріст: 12, вага: 34, досвід: 56</text>
  <text x="26" y="670" class="line"></text>
  <text x="26" y="692" class="line">[8] Тренери та зв’язок із покемоном</text>
  <text x="26" y="714" class="line">Тренера "Ash" додано.</text>
  <text x="26" y="736" class="line">Покемона додано тренеру Ash.</text>
  <text x="26" y="758" class="line">Ash (покемонів: 1)</text>
  <text x="26" y="780" class="line">    testmon</text>
  <text x="26" y="802" class="line"></text>
  <text x="26" y="824" class="line">[4] Видалення тестового запису ID 999</text>
  <text x="26" y="846" class="line">Покемона з ID 999 видалено.</text>
  <text x="26" y="868" class="line">Після видалення залишилися Pikachu і Bulbasaur; ID testmon очищено у тренера.</text>
  <text x="26" y="890" class="line"></text>
  <text x="26" y="912" class="line">Перевірка завершення: застосунок вийшов через пункт 0.</text>
  </g>
  <style>.title {font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #cbd5e1;}</style>
</svg>
